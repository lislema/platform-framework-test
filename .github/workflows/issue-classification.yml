name: Issue Classification

on:
  issues:
    types:
      - opened
      - edited

permissions:
  contents: read
  issues: write

jobs:

  classify-issue:

    runs-on: ubuntu-latest

    steps:

      - name: Classify Issue
        uses: actions/github-script@v7

        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |

            const body = context.payload.issue.body || "";

            const labels = [];

            //
            // Priority
            //
            const priorities = [
              "p0-priority",
              "p1-priority",
              "p2-priority",
              "p3-priority"
            ];

            //
            // Severity
            //
            const severities = [
              "critical",
              "high",
              "medium",
              "low"
            ];

            //
            // Components
            //
            const components = [
              "api",
              "backend",
              "ui-component",
              "database",
              "data-component",
              "infrastructure",
              "ci-cd",
              "security",
              "testing-component",
              "ai-component",
              "ai-agent",
              "documentation",
              "other-component"
            ];

            //
            // Search helper
            //
            function findMatches(values) {
              for (const value of values) {
                if (body.includes(value)) {
                  labels.push(value);
                }
              }
            }

            findMatches(priorities);
            findMatches(severities);
            findMatches(components);

            //
            // Remove duplicates
            //
            const uniqueLabels = [...new Set(labels)];

            if (uniqueLabels.length === 0) {

              console.log("No labels found.");

              return;

            }

            console.log("Applying labels:");
            console.log(uniqueLabels);

            await github.rest.issues.addLabels({

              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: uniqueLabels

            });

            console.log("Issue classification complete.");
