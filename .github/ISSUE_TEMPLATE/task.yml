name: "Task"
description: "Create a development task"
title: "[Task]: "

labels:
  - "task"

body:

  - type: markdown
    attributes:
      value: |
        # Development Task

        Complete all mandatory fields before submitting.

        ---
        ## Enterprise Header
        The first five fields are mandatory for every engineering work item.

  ######################################################################
  # Enterprise Header (Common to ALL Issue Types)
  ######################################################################

  - type: input
    id: requestor_id
    attributes:
      label: Requestor ID
      description: Employee ID or corporate email address.
      placeholder: john.doe@accenture.com
    validations:
      required: true

  - type: input
    id: application_name
    attributes:
      label: Application Name
      description: Name of the application or service.
      placeholder: CNW
    validations:
      required: true

  - type: input
    id: application_id
    attributes:
      label: Application ID (AIR ID)
      description: Enterprise AIR Application Identifier.
      placeholder: "316433"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Select the business priority.
      options:
        - p0-priority
        - p1-priority
        - p2-priority
        - p3-priority
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Primary Component
      description: Select the primary component affected.
      options:
        - api
        - backend
        - ui-component
        - database
        - data-component
        - infrastructure
        - ci-cd
        - security
        - testing-component
        - ai-component
        - ai-agent
        - documentation
        - other-component
    validations:
      required: true

  ######################################################################
  # Task Details
  ######################################################################

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the work that needs to be completed.
      placeholder: |
        Describe the task in sufficient detail.
    validations:
      required: true

  - type: textarea
    id: business_value
    attributes:
      label: Business Value
      description: Explain why this work is required.
      placeholder: |
        Describe the value this task delivers.

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Define the conditions that must be met before this task is considered complete.
      placeholder: |
        - Requirement 1
        - Requirement 2
        - Requirement 3
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Related issues, blockers or prerequisites.
      placeholder: |
        Depends on #123

        Blocked by #456

  - type: textarea
    id: implementation_notes
    attributes:
      label: Implementation Notes
      description: Architecture notes, implementation details or design references.
      placeholder: |
        Design decisions

        API changes

        ADR references

        Documentation links

  - type: textarea
    id: test_plan
    attributes:
      label: Test Plan
      description: Describe how this task will be verified.
      placeholder: |
        Unit Tests

        Integration Tests

        Manual Tests

        Performance Tests

        Security Tests

  ######################################################################
  # Definition of Done
  ######################################################################

  - type: checkboxes
    id: definition_of_done
    attributes:
      label: Definition of Done
      description: Confirm the completion checklist.
      options:
        - label: Code implemented
        - label: Code reviewed
        - label: Unit tests completed
        - label: Integration tests completed
        - label: Documentation updated
        - label: Security review completed
        - label: Acceptance criteria satisfied
